<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Inicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Loading spinner -->
  <div *ngIf="isLoading" class="ion-padding ion-text-center">
    <ion-spinner></ion-spinner>
  </div>

  <!-- Error message -->
  <div *ngIf="error" class="ion-padding">
    <ion-text color="danger">
      {{ error }}
    </ion-text>
  </div>

  <!-- Top 3 Anime Title -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Top 3 Anime</ion-card-title>
    </ion-card-header>
  </ion-card>
  <!-- Top Anime List -->
  <ion-list lines="full" *ngIf="!isLoading && !error">
    <ion-item *ngFor="let anime of topAnimes; let i = index" [routerLink]="['/anime', anime.mal_id]">
      <div class="container">
        <div class="container-logo">
          <div class="rank-indicator">#{{i + 1}}</div>
          <img class="circular-icon" [src]="anime.images.jpg.image_url">
          <ion-label class="item-text">{{ anime.title }}</ion-label>
        </div>
      </div>
      <div class="button-container">
        <ion-button shape="round" (click)="toggleFavorite(anime, $event)">
          <ion-icon slot="icon-only" [name]="isFavorite(anime.mal_id) ? 'heart' : 'heart-outline'"></ion-icon>
        </ion-button>
      </div>
    </ion-item>
  </ion-list>
  
  <!-- Favorites Button -->
  <div class="ion-padding">
    <ion-button expand="block" routerLink="/favoritos">
      <ion-icon name="heart" slot="start"></ion-icon>
      Ver Mis Animes Favoritos
    </ion-button>
  </div>

  <!-- Eliminados todos los elementos visuales relacionados con localización, búsqueda, guardado y listado de ubicaciones -->
</ion-content>
