<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<ion-header [translucent]="true">
  <ion-toolbar>
   <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

 <!-- LOGIN -->
 <div class="container">
   <div class="login-form">
      <div class="auth-heading"><ion-icon name="leaf-outline"></ion-icon><h1>Vuelve a tu anime.</h1><p>Entra a Palmerita para continuar donde lo dejaste.</p></div>
      <p *ngIf="error" role="alert" class="login-error">{{ error }}</p>

      <div class="form-group">
       <ion-input label="Usuario" label-placement="floating" fill="outline" placeholder="Usuario" type="text" [(ngModel)]="identifier"></ion-input>
      </div>
      <div class="form-group">
        <ion-input label="Contraseña" label-placement="floating" fill="outline" placeholder="Contraseña" type="password" [(ngModel)]="password"></ion-input>
      </div>

      <div>
        <ion-button expand="block" (click)="onLoginButtonPressed()">Iniciar sesión</ion-button>
      </div>

      <div class="separator">
        <span>o</span>
      </div>

      <div>
        <ion-button expand="block" color="light" class="google-btn" (click)="googleLogin()">
          <ion-icon slot="start" name="logo-google"></ion-icon>
          Continuar con Google
        </ion-button>
      </div>

      <div>
        <ion-button fill="clear" expand="block" (click)="onRegisterButtonPressed()">Crear una cuenta</ion-button>
      </div>

    </div>
  </div>

</ion-content>
