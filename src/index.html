<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Palmerita · Tu mundo anime</title>
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('palmerita-theme'); } catch (e) {}
      var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('ion-palette-dark', dark);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.webp" />

  <!-- add to homescreen for ios -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Palmerita" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
